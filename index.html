	<script>
        $(document).ready(function() {
			
			/* 백그라운드 컬러 */
            const COLORS = [
				'#D80027',
                '#12D800',
                '#FFA600',
				'#D80068',
                '#0070D8',
                '#FF5900',
				'#00CDBC',				
            ];
            const DURATION = 10000;
            let colorIndex = 0;
            function changeBackgroundColor() {
                colorIndex = (colorIndex + 1) % COLORS.length;
                $('.main_wrap').css('background-color', COLORS[colorIndex]);
            }
            setInterval(changeBackgroundColor, DURATION);

			/* 동작 타이머 */
			const IDLE_TIME_LIMIT = 120000;
			let idleTimer;
			const targetUrl = 'index.html';
			function startIdleTimer() {
				clearTimeout(idleTimer);
				idleTimer = setTimeout(redirectToHome, IDLE_TIME_LIMIT);
			}
			function redirectToHome() {
				window.location.href = targetUrl;
			}
			$(document).on('mousemove keydown scroll touchstart touchend', function() {
				startIdleTimer();
			});
			startIdleTimer();

			/* 리스트 순서 랜덤 */
			const $list = $('.thumb_list');
			const $listItems = $list.children('li').get();
			function shuffleArray(array) {
				for (let i = array.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[array[i], array[j]] = [array[j], array[i]];
				}
				return array;
			}
			const $shuffledItems = $(shuffleArray($listItems));
			$list.empty().append($shuffledItems);
			
		});
	</script>
